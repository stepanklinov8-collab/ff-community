name: Site verification
on:
  pull_request:
  push:
    branches: [main, codex/update-3-foundation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/database-tests/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tools/database-tests
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
