name: Event notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger scheduled notifications
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL and CRON_SECRET repository secrets are required."
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL%/}/api/cron/event-notifications"
